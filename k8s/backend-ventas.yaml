apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-back-ventas
  labels:
    app: back-ventas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back-ventas
  template:
    metadata:
      labels:
        app: back-ventas
    spec:
      containers:
      - name: back-ventas-container
        image: 251831776279.dkr.ecr.us-east-1.amazonaws.com/innovatech-back-ventas-repo:latest
        ports:
        - containerPort: 8081
        env:
        # Forzamos a Spring Boot a usar la base de datos interna de prueba H2
        - name: SPRING_PROFILES_ACTIVE
          value: "test"
---
apiVersion: v1
kind: Service
metadata:
  name: back-ventas-service
spec:
  type: ClusterIP
  selector:
    app: back-ventas
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081