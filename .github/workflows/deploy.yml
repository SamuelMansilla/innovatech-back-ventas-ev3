name: Innovatech Ventas CI/CD Pipeline - EV3

on:
  push:
    branches:
      - deploy  # Se activa al hacer push a la rama 'deploy'

jobs:
  deploy:
    name: Build, Push Ventas to ECR and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código nuevo
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Configurar las credenciales de AWS Academy (Secrets)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 3. Autenticar Docker con Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 4. Compilar y subir la imagen hacia AWS ECR
    - name: Build and Push Ventas Backend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: innovatech-back-ventas-ev3
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./Springboot-API-REST
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    # 5. Conectarse a tu clúster de Kubernetes en AWS
    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region us-east-1 --name innovatech-cluster

    # 6. Aplicar los manifiestos de Kubernetes
    - name: Deploy Ventas to Amazon EKS
      run: |
        kubectl apply -f k8s/backend-ventas.yaml

    # 7. Reiniciar pods para aplicar la actualización
    - name: Rollout Restart Ventas
      run: |
        kubectl rollout restart deployment/innovatech-back-ventas